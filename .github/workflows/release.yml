name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in package.json manifest.json; do
            v=$(node -p "require('./$f').version")
            [ "$v" = "$tag" ] || { echo "$f version $v != tag $tag"; exit 1; }
          done
      - run: npm ci --omit=dev
      - run: npx -y @anthropic-ai/mcpb validate manifest.json
      - run: npx -y @anthropic-ai/mcpb pack . imessage-mcp.mcpb
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" imessage-mcp.mcpb --title "$GITHUB_REF_NAME" --generate-notes
